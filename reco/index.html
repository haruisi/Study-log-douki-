<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f6f7fb" />
  <meta name="color-scheme" content="light" />
  <title>Reco</title>
  <link rel="manifest" href="manifest.webmanifest?v=0.6.1" />
  <link rel="stylesheet" href="styles.css?v=0.6.1" />
  <link rel="stylesheet" href="fixes.css?v=0.6.1" />
  <link rel="stylesheet" href="insights.css?v=0.6.1" />
  <link rel="stylesheet" href="activity-log-fixes.css?v=0.7.2" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-nav="home" aria-label="ホームへ">Reco</button>
      <div class="top-actions">
        <button id="syncBtn" class="icon-btn sync-btn" data-state="off" aria-label="端末間同期" title="端末間同期">☁︎</button>
        <span class="version-badge" aria-label="現在のバージョン">v0.7.2</span>
        <button id="exportBtn" class="icon-btn" aria-label="データを書き出す" title="Export JSON">⇩</button>
      </div>
    </header>

    <main>
      <section id="view-home" class="view active"></section>
      <section id="view-start" class="view"></section>
      <section id="view-detail" class="view"></section>
      <section id="view-search" class="view"></section>
      <section id="view-stats" class="view"></section>
    </main>

    <button id="fab" class="fab" aria-label="勉強を開始">＋</button>

    <nav class="bottom-nav" aria-label="メインナビゲーション">
      <button data-nav="home" class="nav-item active"><span>⌂</span><small>Home</small></button>
      <button data-nav="search" class="nav-item"><span>⌕</span><small>Search</small></button>
      <button data-nav="stats" class="nav-item"><span>▥</span><small>Insights</small></button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modalRoot"></div>

  <script src="app.js?v=0.6.1"></script>
  <script src="fixes.js?v=0.6.3"></script>
  <script src="statusbar-fix.js?v=0.6.4"></script>
  <script src="insights.js?v=0.6.1"></script>
  <script src="sync.js?v=0.6.1"></script>
  <script src="activity-log.js?v=0.7.2"></script>
  <script src="activity-log-sync.js?v=0.7.2"></script>
</body>
</html>
